name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual dispatch covers the case where the tag can't be pushed directly
  # (e.g. branch-scoped credentials): the release step creates `tag` at
  # `commit` if the tag doesn't exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
      commit:
        description: "Full 40-char SHA or branch the tag should point at (defaults to the dispatched ref; the releases API rejects abbreviated SHAs)"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          # macos-latest runners are arm64; ship an Apple Silicon dmg and
          # revisit universal binaries if Intel users ask.
          - os: macos-latest
            bundles: dmg
          # ubuntu-22.04 keeps the AppImage glibc floor low; 24.04 would
          # exclude older distros.
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: cargo run -p projectpacker-app --bin emit-bindings
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          # linuxdeploy's strip step is flaky inside the AppImage bundler;
          # the release profile already strips symbols.
          NO_STRIP: true

      - name: Collect artifacts
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="$(find . -type d -path '*/release/bundle' | head -1)"
          mkdir dist
          case "${{ runner.os }}" in
            Windows)
              cp "$BUNDLE_DIR"/msi/*.msi   "dist/ProjectPacker_${VERSION}_x64-setup.msi"
              cp "$BUNDLE_DIR"/nsis/*.exe  "dist/ProjectPacker_${VERSION}_x64-setup.exe"
              ;;
            macOS)
              cp "$BUNDLE_DIR"/dmg/*.dmg   "dist/ProjectPacker_${VERSION}_aarch64.dmg"
              ;;
            Linux)
              cp "$BUNDLE_DIR"/appimage/*.AppImage "dist/ProjectPacker_${VERSION}_amd64.AppImage"
              cp "$BUNDLE_DIR"/deb/*.deb           "dist/ProjectPacker_${VERSION}_amd64.deb"
              ;;
          esac
          cd dist
          for f in *; do
            { command -v sha256sum >/dev/null && sha256sum "$f" || shasum -a 256 "$f"; } > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## / { flag=0 }
            flag' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Release $VERSION" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Only consulted when the tag doesn't exist yet (dispatch path).
          target_commitish: ${{ inputs.commit || github.sha }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
